<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vector Graphics Editing Application</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: drafting-table workspace. Tool rail on the left, white paper in the middle, inspector on the right, status line below. */
:root {
  --bg: #e9ecf1;
  --panel: #f7f8fa;
  --panel-2: #e4e8ee;
  --line: #ccd2db;
  --fg: #1a2130;
  --muted: #566173;
  --accent: #2a4fd6;
  --accent-fg: #ffffff;
  --sel: #2a4fd6;
  --ok: #1d7a3b;
  --bad: #b3261e;
  --shadow: rgba(18, 28, 48, .18);
  --paper: #ffffff;
  --paper-grid: #e7eaf0;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151c; --panel: #1a2029; --panel-2: #252d39; --line: #333d4c; --fg: #e5e9f0; --muted: #9ba6b7;
    --accent: #8ea8ff; --accent-fg: #0c1330; --ok: #5fcf88; --bad: #ff8f86; --shadow: rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151c; --panel: #1a2029; --panel-2: #252d39; --line: #333d4c; --fg: #e5e9f0; --muted: #9ba6b7;
  --accent: #8ea8ff; --accent-fg: #0c1330; --ok: #5fcf88; --bad: #ff8f86; --shadow: rgba(0, 0, 0, .5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app {
  height: 100%; display: grid; gap: 10px;
  grid-template-columns: 76px minmax(0, 1fr) 268px;
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "top top top" "rail stage insp" "status status status";
}
.top { grid-area: top; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; min-width: 0; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; letter-spacing: .01em; }
.brand svg { color: var(--accent); }
.pname {
  height: 32px; width: 220px; max-width: 100%; padding: 0 10px; border: 1px solid transparent; border-radius: 6px;
  background: transparent; font-weight: 500;
}
.pname:hover { border-color: var(--line); }
.pname:focus { border-color: var(--accent); background: var(--panel); }
.dirty { font: 500 12px var(--mono); color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-left: auto; min-width: 0; }
.sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
.btn {
  height: 32px; padding: 0 12px; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; cursor: pointer;
  white-space: nowrap;
}
.btn:hover:not(:disabled) { background: var(--panel-2); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 500; }
.btn.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
.btn.danger { color: var(--bad); }

.rail { grid-area: rail; display: flex; flex-direction: column; gap: 6px; }
.tool {
  display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px 6px; border: 1px solid var(--line);
  background: var(--panel); border-radius: 6px; cursor: pointer; font-size: 11.5px; color: var(--muted);
}
.tool svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
.tool:hover { background: var(--panel-2); color: var(--fg); }
.tool[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.tool kbd { font: 400 10px var(--mono); opacity: .75; }

.stage {
  grid-area: stage; min-width: 0; min-height: 0; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
  display: flex; align-items: center; justify-content: center; padding: 14px; overflow: hidden;
}
#cv { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; filter: drop-shadow(0 2px 10px var(--shadow)); }
.stage.t-line #cv, .stage.t-rect #cv, .stage.t-circle #cv, .stage.t-polygon #cv { cursor: crosshair; }
.sel-frame { fill: none; stroke: var(--sel); stroke-width: 1.5; stroke-dasharray: 6 4; vector-effect: non-scaling-stroke; pointer-events: none; }
.rot-line { stroke: var(--sel); stroke-width: 1.5; vector-effect: non-scaling-stroke; pointer-events: none; }
.handle { fill: #fff; stroke: var(--sel); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.handle[data-h="n"], .handle[data-h="s"] { cursor: ns-resize; }
.handle[data-h="e"], .handle[data-h="w"] { cursor: ew-resize; }
.handle[data-h="nw"], .handle[data-h="se"] { cursor: nwse-resize; }
.handle[data-h="ne"], .handle[data-h="sw"] { cursor: nesw-resize; }
.handle[data-h="rot"] { cursor: grab; }
.draft { fill: none; stroke: var(--sel); stroke-width: 1.5; vector-effect: non-scaling-stroke; pointer-events: none; }
.draft-dot { fill: #fff; stroke: var(--sel); stroke-width: 1.5; vector-effect: non-scaling-stroke; pointer-events: none; }

.inspector {
  grid-area: insp; min-width: 0; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 12px 14px; display: flex; flex-direction: column; gap: 16px;
}
.inspector h2 { margin: 0 0 8px; font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.insp-title { font-weight: 600; font-size: 14px; margin: 0; }
.insp-sub { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
.row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; min-width: 0; }
.row > label:first-child { width: 82px; flex: none; color: var(--muted); }
.row input[type="color"] { width: 40px; height: 30px; padding: 2px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); cursor: pointer; }
.row input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); }
.num {
  width: 64px; height: 30px; padding: 0 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper);
  color: #1a2130; font: 400 13px var(--mono); font-variant-numeric: tabular-nums;
}
:root[data-theme="dark"] .num { background: #0f131a; color: var(--fg); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .num { background: #0f131a; color: var(--fg); } }
.chk { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12.5px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid2 .f { display: flex; align-items: center; gap: 6px; min-width: 0; }
.grid2 .f label { width: 14px; color: var(--muted); font: 500 12px var(--mono); }
.grid2 .f .num { width: 100%; min-width: 0; }
.rot-row { margin-top: 8px; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.inspector fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
.inspector fieldset:disabled { opacity: .5; }

.status { grid-area: status; display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: center; color: var(--muted); font-size: 12.5px; min-width: 0; }
.status .hint { flex: 1 1 320px; min-width: 0; }
.status .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

#modal { position: fixed; inset: 0; z-index: 50; background: rgba(8, 12, 20, .55); display: flex; align-items: flex-start; justify-content: center; padding: 5vh max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
#modal[hidden] { display: none; }
.dialog { width: 100%; max-width: 560px; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 18px 50px rgba(0, 0, 0, .35); }
.dialog.wide { max-width: 960px; }
.dialog header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.dialog h1 { margin: 0; font-size: 16px; font-weight: 600; }
.dialog .body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.dialog h3 { margin: 0 0 4px; font-size: 13px; font-weight: 600; }
.dialog p { margin: 0; }
.dialog ul, .dialog ol { margin: 4px 0 0; padding-left: 20px; }
.dialog li { margin-bottom: 3px; }
.note { color: var(--muted); font-size: 13px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field > span { color: var(--muted); font-size: 12.5px; }
.txt { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: #1a2130; }
:root[data-theme="dark"] .txt { background: #0f131a; color: var(--fg); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .txt { background: #0f131a; color: var(--fg); } }
textarea.txt { font: 400 12px var(--mono); resize: vertical; min-height: 110px; }
.err { color: var(--bad); font-weight: 500; min-height: 1.2em; }
.list { border: 1px solid var(--line); border-radius: 6px; }
.list .item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-bottom: 1px solid var(--line); min-width: 0; }
.list .item:last-child { border-bottom: 0; }
.list .item .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
.list .item .meta { color: var(--muted); font: 400 12px var(--mono); }
.list .empty { padding: 12px; color: var(--muted); }
.scroll-x { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { text-align: left; vertical-align: top; padding: 7px 9px; border-bottom: 1px solid var(--line); }
th { background: var(--panel-2); font-weight: 600; white-space: nowrap; }
td.id { font-family: var(--mono); white-space: nowrap; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font: 500 11.5px var(--mono); border: 1px solid currentColor; }
.pill.pass { color: var(--ok); } .pill.fail { color: var(--bad); } .pill.skip { color: var(--muted); }
.summary { font-weight: 600; }
kbd { font: 500 12px var(--mono); padding: 1px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel-2); }
#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; max-width: calc(100vw - 32px); padding: 9px 14px; border-radius: 8px; background: var(--fg); color: var(--bg); font-size: 13px; box-shadow: 0 6px 20px rgba(0, 0, 0, .3); }
#toast[hidden] { display: none; }
#toast.bad { background: var(--bad); color: #fff; }

@media (max-width: 860px) {
  html, body { height: auto; }
  #app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; grid-template-areas: "top" "rail" "stage" "insp" "status"; }
  .actions { margin-left: 0; }
  .rail { flex-direction: row; flex-wrap: wrap; }
  .tool { flex: 1 1 56px; }
  .stage { height: min(66vh, 72vw); min-height: 260px; padding: 8px; }
  .inspector { overflow: visible; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div id="app">
  <header class="top">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 18L11 3l8 15z"/><circle cx="11" cy="3" r="1.6" fill="var(--panel)"/><circle cx="3" cy="18" r="1.6" fill="var(--panel)"/><circle cx="19" cy="18" r="1.6" fill="var(--panel)"/></svg>
      <span>Vector Editor</span>
    </div>
    <input id="pname" class="pname" value="Untitled drawing" maxlength="60" aria-label="Project name" spellcheck="false">
    <span id="dirty" class="dirty" hidden>Unsaved changes</span>
    <nav class="actions" aria-label="Project and edit actions">
      <button id="bNew" class="btn" type="button">New</button>
      <button id="bOpen" class="btn" type="button">Open</button>
      <button id="bSave" class="btn primary" type="button">Save</button>
      <span class="sep"></span>
      <button id="bUndo" class="btn" type="button" title="Undo (Ctrl+Z)">Undo</button>
      <button id="bRedo" class="btn" type="button" title="Redo (Ctrl+Y)">Redo</button>
      <button id="bCopy" class="btn" type="button" title="Copy (Ctrl+C)">Copy</button>
      <button id="bPaste" class="btn" type="button" title="Paste (Ctrl+V)">Paste</button>
      <button id="bDel" class="btn danger" type="button" title="Delete (Del)">Delete</button>
      <span class="sep"></span>
      <button id="bTests" class="btn" type="button">Tests</button>
      <button id="bHelp" class="btn" type="button">Help</button>
    </nav>
  </header>

  <aside class="rail" id="rail" aria-label="Tools">
    <button class="tool" type="button" data-tool="select" aria-pressed="true" title="Select (V)"><svg viewBox="0 0 22 22"><path d="M5 3l12 7-5.2 1.6L9.2 17z"/></svg>Select<kbd>V</kbd></button>
    <button class="tool" type="button" data-tool="line" aria-pressed="false" title="Line (L)"><svg viewBox="0 0 22 22"><path d="M4 18L18 4"/></svg>Line<kbd>L</kbd></button>
    <button class="tool" type="button" data-tool="rect" aria-pressed="false" title="Rectangle (R)"><svg viewBox="0 0 22 22"><rect x="3.5" y="5.5" width="15" height="11"/></svg>Rectangle<kbd>R</kbd></button>
    <button class="tool" type="button" data-tool="circle" aria-pressed="false" title="Circle (C)"><svg viewBox="0 0 22 22"><circle cx="11" cy="11" r="7.5"/></svg>Circle<kbd>C</kbd></button>
    <button class="tool" type="button" data-tool="polygon" aria-pressed="false" title="Polygon (P)"><svg viewBox="0 0 22 22"><path d="M11 3.5l7.5 5.5-3 9h-9l-3-9z"/></svg>Polygon<kbd>P</kbd></button>
  </aside>

  <main class="stage t-select" id="stage">
    <svg id="cv" viewBox="0 0 1200 800" role="img" aria-label="Drawing canvas">
      <defs>
        <pattern id="gridp" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#e7eaf0" stroke-width="1"/></pattern>
        <clipPath id="paperClip"><rect width="1200" height="800"/></clipPath>
      </defs>
      <rect id="paper" width="1200" height="800" fill="#ffffff"/>
      <rect id="gridrect" width="1200" height="800" fill="url(#gridp)" pointer-events="none"/>
      <g id="objects" clip-path="url(#paperClip)"></g>
      <g id="overlay"></g>
    </svg>
  </main>

  <aside class="inspector" id="insp" aria-label="Properties">
    <div>
      <p class="insp-title" id="inspTitle">New shape settings</p>
      <p class="insp-sub" id="inspSub">Choose a tool, or click a shape to edit it.</p>
    </div>
    <section>
      <h2>Appearance</h2>
      <div class="row"><label for="fillc">Fill</label><input type="color" id="fillc" value="#cfe0ff"><label class="chk" for="fillnone"><input type="checkbox" id="fillnone"> None</label></div>
      <div class="row"><label for="strokec">Border</label><input type="color" id="strokec" value="#1a2130"></div>
      <div class="row"><label for="swn">Stroke width</label><input type="range" id="swr" min="0" max="30" step="1" value="2" aria-label="Stroke width slider"><input class="num" type="number" id="swn" min="0" max="100" step="1" value="2" style="width:56px"></div>
    </section>
    <section>
      <h2>Position and size</h2>
      <fieldset id="geo" disabled>
        <div class="grid2">
          <div class="f"><label for="fx">X</label><input class="num" type="number" id="fx" step="1"></div>
          <div class="f"><label for="fy">Y</label><input class="num" type="number" id="fy" step="1"></div>
          <div class="f"><label for="fw">W</label><input class="num" type="number" id="fw" step="1" min="1"></div>
          <div class="f"><label for="fh">H</label><input class="num" type="number" id="fh" step="1" min="1"></div>
        </div>
        <div class="row rot-row"><label for="frot">Rotation</label><input class="num" type="number" id="frot" step="1"><span class="note">degrees</span></div>
      </fieldset>
    </section>
    <section>
      <h2>Arrange</h2>
      <fieldset id="arr" disabled>
        <div class="btns"><button id="bFront" class="btn" type="button">Bring to front</button><button id="bBack" class="btn" type="button">Send to back</button></div>
      </fieldset>
    </section>
  </aside>

  <footer class="status">
    <span class="hint" id="hint"></span>
    <label class="chk"><input type="checkbox" id="gridchk" checked> Grid</label>
    <span class="mono" id="count">0 objects</span>
    <span class="mono" id="coords">x 0  y 0</span>
  </footer>
</div>

<div id="modal" hidden>
  <div class="dialog" id="dlg" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <header><h1 id="mTitle"></h1><button id="mClose" class="btn" type="button">Close</button></header>
    <div class="body" id="mBody"></div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function () {
'use strict';

/* ================= Shared state and helpers ================= */
var NS = 'http://www.w3.org/2000/svg';
var APP = 'vector-graphics-editor', VERSION = 1, STORE_KEY = 'vge.projects.v1';
var CW = 1200, CH = 800, MIN = 2;
var HEX = /^#[0-9a-fA-F]{6}$/;
var TYPES = ['rect', 'circle', 'line', 'polygon'];
var LABELS = { rect: 'Rectangle', circle: 'Circle', line: 'Line', polygon: 'Polygon' };

function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function clone(v) { return JSON.parse(JSON.stringify(v)); }
function fmt(n) { return Math.round(n * 10) / 10; }
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function num(v) { var n = parseFloat(v); return isFinite(n) ? n : null; }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function elNS(tag, attrs) { var e = document.createElementNS(NS, tag); if (attrs) for (var k in attrs) e.setAttribute(k, attrs[k]); return e; }

var state = {
  objects: [], sel: null, tool: 'select', clip: null, seq: 0, name: 'Untitled drawing', dirty: false,
  defaults: { fill: '#cfe0ff', stroke: '#1a2130', sw: 2 }
};
var H = { stack: [], i: -1 };
var drag = null, draft = null;
var lastFill = '#cfe0ff';
var svg = $('#cv'), layer = $('#objects'), overlay = $('#overlay'), stage = $('#stage');

function newId() { state.seq += 1; return 'o' + state.seq; }
function find(id) { for (var i = 0; i < state.objects.length; i++) if (state.objects[i].id === id) return state.objects[i]; return null; }
function sel() { return state.sel ? find(state.sel) : null; }

/* ================= Geometry ================= */
function bbox(o) {
  if (!o.pts) return { x: o.x, y: o.y, w: o.w, h: o.h };
  var minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
  o.pts.forEach(function (p) { minx = Math.min(minx, p[0]); maxx = Math.max(maxx, p[0]); miny = Math.min(miny, p[1]); maxy = Math.max(maxy, p[1]); });
  return { x: minx, y: miny, w: maxx - minx, h: maxy - miny };
}
function center(o) { var b = bbox(o); return { x: b.x + b.w / 2, y: b.y + b.h / 2 }; }
function rotv(v, a) { return { x: v.x * Math.cos(a) - v.y * Math.sin(a), y: v.x * Math.sin(a) + v.y * Math.cos(a) }; }
function worldPoint(o, local) { var c = center(o), r = rotv(local, (o.rot || 0) * Math.PI / 180); return { x: c.x + r.x, y: c.y + r.y }; }
function clampPt(p) { return { x: clamp(p.x, 0, CW), y: clamp(p.y, 0, CH) }; }

/* ================= Drawing Module: create and display vector shapes ================= */
var Drawing = {
  base: function (type) {
    return { id: newId(), type: type, fill: type === 'line' ? 'none' : state.defaults.fill, stroke: state.defaults.stroke, sw: state.defaults.sw, rot: 0 };
  },
  fromDrag: function (type, a, b, shift) {
    var o = Drawing.base(type), dx = b.x - a.x, dy = b.y - a.y;
    if (type === 'line') {
      if (shift) {
        var ang = Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) * (Math.PI / 4), len = Math.hypot(dx, dy);
        dx = Math.cos(ang) * len; dy = Math.sin(ang) * len; b = { x: a.x + dx, y: a.y + dy };
      }
      if (Math.hypot(dx, dy) < 3) return null;
      o.pts = [[a.x, a.y], [b.x, b.y]];
      return o;
    }
    if (type === 'circle' || (type === 'rect' && shift)) {
      var s = Math.max(Math.abs(dx), Math.abs(dy));
      dx = dx < 0 ? -s : s; dy = dy < 0 ? -s : s;
    }

        box.innerHTML = '';
        names.forEach(function (n) {
          var meta = '';

        var rd = new FileReader();

    });

$('#swn').addEventListener('change', function () { var n = num(this.value); if (n === null) { toast('Stroke width must be a number.', 'bad'); syncInspector(true); return; } endEdit(); syncInspector(true); });
function onBox() {
  var o = sel(); if (!o) return;
  var nb = { x: num($('#fx').value), y: num($('#fy').value), w: num($('#fw').value), h: num($('#fh').value) };
  if (nb.x === null || nb.y === null || nb.w === null || nb.h === null) { toast('Position and size must be numbers.', 'bad'); syncInspector(true); return; }
  nb.w = Math.max(1, nb.w); nb.h = Math.max(1, nb.h);
  Obj.applyBox(o, nb); commit(); render(); syncInspector(true);
}
['fx', 'fy', 'fw', 'fh'].forEach(function (id) { $('#' + id).addEventListener('change', onBox); });
$('#frot').addEventListener('change', function () {
  var o = sel(), n = num(this.value); if (!o) return;
  if (n === null) { toast('Rotation must be a number of degrees.', 'bad'); syncInspector(true); return; }
  Obj.setRotation(o, n); commit(); render(); syncInspector(true);
});
$('#bFront').onclick = function () { if (state.sel) { Obj.front(state.sel); commit(); render(); } };
$('#bBack').onclick = function () { if (state.sel) { Obj.back(state.sel); commit(); render(); } };

document.addEventListener('keydown', function (e) {
  var tag = (e.target && e.target.tagName) || '';
  if (!$('#modal').hidden) { if (e.key === 'Escape') closeModal(); return; }
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  var mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (mod) {
    if (k === 'z') { e.preventDefault(); if (e.shiftKey) doRedo(); else doUndo(); }
    else if (k === 'y') { e.preventDefault(); doRedo(); }
    else if (k === 'c') { if (state.sel) { e.preventDefault(); doCopy(); } }
    else if (k === 'v') { e.preventDefault(); doPaste(); }
    return;
  }
  if (e.key === 'Delete' || e.key === 'Backspace') { if (state.sel) { e.preventDefault(); doDelete(); } }
  else if (e.key === 'Escape') { if (draft) { cancelDraft(); render(); } else if (drag) endDrag(e, true); else { state.sel = null; render(); } }
  else if (e.key === 'Enter') { if (draft) finishPolygon(); }
  else if (e.key.indexOf('Arrow') === 0 && sel()) {
    e.preventDefault(); var st = e.shiftKey ? 10 : 1, o = sel();
    Obj.translate(o, e.key === 'ArrowLeft' ? -st : e.key === 'ArrowRight' ? st : 0, e.key === 'ArrowUp' ? -st : e.key === 'ArrowDown' ? st : 0);
    commit(); render();
  } else if ({ v: 'select', l: 'line', r: 'rect', c: 'circle', p: 'polygon' }[k]) setTool({ v: 'select', l: 'line', r: 'rect', c: 'circle', p: 'polygon' }[k]);
});
if (window.ResizeObserver) new ResizeObserver(function () { renderOverlay(); }).observe(stage);
window.addEventListener('resize', renderOverlay);

/* --- start with a small sample drawing --- */
function sample() {
  function mk(type, props) { var o = { id: newId(), type: type, fill: '#cfe0ff', stroke: '#1a2130', sw: 2, rot: 0 }; for (var k in props) o[k] = props[k]; return o; }
  return [
    mk('line', { fill: 'none', pts: [[120, 600], [1080, 600]], stroke: '#3b6b3a', sw: 6 }),
    mk('circle', { x: 880, y: 110, w: 120, h: 120, fill: '#ffd34d', stroke: '#c79400', sw: 3 }),
    mk('rect', { x: 420, y: 380, w: 300, h: 220, fill: '#f3d9a4', stroke: '#3b2f1d', sw: 3 }),
    mk('polygon', { pts: [[395, 380], [570, 250], [745, 380]], fill: '#c4553a', stroke: '#3b2f1d', sw: 3 }),
    mk('rect', { x: 540, y: 470, w: 70, h: 130, fill: '#7a4a2b', stroke: '#3b2f1d', sw: 3 }),
    mk('rect', { x: 450, y: 440, w: 60, h: 60, fill: '#cfe6ff', stroke: '#3b2f1d', sw: 3 }),
    mk('rect', { x: 635, y: 440, w: 60, h: 60, fill: '#cfe6ff', stroke: '#3b2f1d', sw: 3 })
  ];
}
state.objects = sample(); resetHistory(); setDirty(false);
setTool('select');
setHint('Sample drawing loaded. Choose New for a blank canvas. ' + HINTS.select);
})();
</script>
